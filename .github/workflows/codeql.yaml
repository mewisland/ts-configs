name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check default setup state
        id: default-setup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state="$(gh api "repos/${GH_REPO}/code-scanning/default-setup" --jq '.state // "not-configured"')"
          echo "state=${state}" >>"${GITHUB_OUTPUT}"
      - name: Skip because default setup is enabled
        if: ${{ steps.default-setup.outputs.state == 'configured' }}
        run: echo "Skipping advanced CodeQL workflow because default setup is enabled."
      - name: Initialize CodeQL
        if: ${{ steps.default-setup.outputs.state != 'configured' }}
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        if: ${{ steps.default-setup.outputs.state != 'configured' }}
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Perform CodeQL analysis
        if: ${{ steps.default-setup.outputs.state != 'configured' }}
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
